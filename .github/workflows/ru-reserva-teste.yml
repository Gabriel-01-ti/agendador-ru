name: Teste real de reserva
on:
  workflow_dispatch:
    inputs:
      data_almoco:
        description: 'Data do almoço (AAAA-MM-DD). Fará UMA reserva real agora; escolha um dia útil futuro.'
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: ru-semanal
  cancel-in-progress: false
jobs:
  reserva-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_RESERVATION_DATE: ${{ inputs.data_almoco }}
      RU_USER: ${{ secrets.RU_USER }}
      RU_PASSWORD: ${{ secrets.RU_PASSWORD }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      STATE_BACKEND: github
      STATE_REPOSITORY: ${{ github.repository }}
      STATE_TOKEN: ${{ github.token }}
      DATA_DIR: /tmp/ru-real-test
      HEADLESS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador e dependências
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Reservar um almoço com a conta salva
        run: python reserve_test.py
