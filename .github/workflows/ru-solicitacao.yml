name: Reserva por solicitação
on:
  push:
    branches: [main]
    paths:
      - '.github/ru-request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ru-semanal
  cancel-in-progress: false
jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCHEDULE_ENABLED: ${{ secrets.SCHEDULE_ENABLED }}
      RU_USER: ${{ secrets.RU_USER }}
      RU_PASSWORD: ${{ secrets.RU_PASSWORD }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      STATE_BACKEND: github
      STATE_REPOSITORY: ${{ github.repository }}
      STATE_TOKEN: ${{ github.token }}
      REMINDER_ENABLED: 'false'
      CUTOFF_TIME: '15:55'
      HEADLESS: 'true'
      DATA_DIR: /tmp/ru-state
      WAIT_FOR_BOOKING: 'false'
      CHECK_ONLY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Preparar navegador
        run: python -m playwright install --with-deps chromium
      - name: Reservar semana solicitada com proteção contra duplicação
        run: python requested.py
