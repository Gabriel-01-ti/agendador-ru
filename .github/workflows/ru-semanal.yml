name: Programação gratuita do RU
on:
  schedule:
    # UTC: prepara às 08:17 de Brasília e aguarda até 09:00.
    - cron: '17 11 * * 0'
    # Execução principal às 09:00 e ciclos de recuperação sem duplicar reservas.
    - cron: '0 12 * * 0'
    - cron: '17 12,13,15,18 * * 0'
    - cron: '37 12 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ru-semanal.yml'
      - 'scheduled.py'
      - 'weekly.py'
      - 'worker.py'
      - 'github_state.py'
  workflow_dispatch:
    inputs:
      verificar_apenas:
        description: Verificar configuração sem enviar mensagens ou fazer reservas
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: ru-semanal
  cancel-in-progress: false
jobs:
  programacao:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCHEDULE_ENABLED: ${{ secrets.SCHEDULE_ENABLED }}
      RU_USER: ${{ secrets.RU_USER }}
      RU_PASSWORD: ${{ secrets.RU_PASSWORD }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      STATE_BACKEND: github
      STATE_REPOSITORY: ${{ github.repository }}
      STATE_TOKEN: ${{ github.token }}
      REMINDER_ENABLED: 'false'
      CUTOFF_TIME: '15:55'
      HEADLESS: 'true'
      DATA_DIR: /tmp/ru-state
      WAIT_FOR_BOOKING: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      CHECK_ONLY: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.verificar_apenas)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        if: env.SCHEDULE_ENABLED == 'true'
        run: python -m pip install -r requirements.txt
      - name: Preparar navegador para reservas
        if: env.SCHEDULE_ENABLED == 'true' && env.CHECK_ONLY != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Processar domingo ou verificar configuração
        if: env.SCHEDULE_ENABLED == 'true'
        run: python scheduled.py
      - name: Configuração pendente
        if: env.SCHEDULE_ENABLED != 'true'
        run: |
          echo 'Cadastre os Secrets e SCHEDULE_ENABLED=true para ativar a programação.'
          exit 1
