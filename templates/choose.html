<!doctype html><html lang="pt-BR"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escolher almoços — RU</title><link rel="stylesheet" href="/static/style.css"><main class="container"><section class="card"><h1>Almoços da semana de {{week}}</h1><p>Escolha até domingo, {{booking}} (Brasília). Nesse horário o sistema tentará fazer as reservas.</p><p>Deixe todos desmarcados para não reservar nesta semana. Este link é pessoal.</p><form method="post">{% for name in ['Segunda','Terça','Quarta','Quinta','Sexta'] %}<label class="checkbox-inline"><input type="checkbox" name="dias" value="{{loop.index0}}" {% if loop.index0 in days %}checked{% endif %}>{{name}} — {{dates[loop.index0]}}</label>{% endfor %}<button class="primary">Confirmar dias desta semana</button></form><p role="status">{{message}}</p></section></main></html>
